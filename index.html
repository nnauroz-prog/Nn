<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Villa Dream — Wartungsmodus</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      text-align: center;
      padding: 2rem;
    }
    .maintenance {
      max-width: 540px;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      opacity: 0.7;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #fff;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #a3a3a3;
      margin-bottom: 1rem;
    }
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a96e, transparent);
      margin: 1.5rem auto;
    }
    .contact {
      font-size: 0.9rem;
      color: #737373;
    }
    .contact a {
      color: #c9a96e;
      text-decoration: none;
    }
    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="maintenance">
    <div class="icon">&#9881;</div>
    <h1>Website im Wartungsmodus</h1>
    <p>Wir arbeiten gerade an unserer Website und sind bald wieder f&uuml;r Sie da.</p>
    <div class="divider"></div>
    <p class="contact">Bei Fragen erreichen Sie uns unter<br><a href="mailto:nnauroz@live.de">nnauroz@live.de</a></p>
  </div>
</body>
</html>
